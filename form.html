<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechNova — Mon compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <main class="form-page">
        <a class="form-logo" href="index.html">Tech<span>Nova</span></a>

        <form action="" class="form-carte row g-3">
            <div class="col-12">
                <h1>Créer un compte</h1>
                <p class="form-sous-titre">Renseignez vos informations pour rejoindre TechNova.</p>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="name">Nom</label>
                <input class="form-control" type="text" name="name" id="name" autocomplete="name">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" name="email" id="email" autocomplete="email">
            </div>
            <div class="col-12">
                <label class="form-label" for="adresse">Adresse</label>
                <input class="form-control" type="text" name="adresse" id="adresse" autocomplete="street-address">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cp">Code postal</label>
                <input class="form-control" type="text" name="cp" id="cp" autocomplete="postal-code">
            </div>
            <div class="col-md-8">
                <label class="form-label" for="ville">Ville</label>
                <input class="form-control" type="text" name="ville" id="ville" autocomplete="address-level2">
            </div>
            <div class="col-12 d-flex flex-wrap gap-3 mt-4">
                <button class="form-bouton" type="submit">Envoyer</button>
                <a class="form-retour" href="index.html">Retour à l'accueil</a>
            </div>
        </form>
    </main>
</body>

</html>
